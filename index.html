<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NSU Cover Page Generator</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=EB+Garamond:wght@700&family=Montserrat:wght@700&family=Playfair+Display:wght@700&family=Oswald:wght@600&display=swap" rel="stylesheet">

    <style>
        body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #18181b; }

        .side-scroll::-webkit-scrollbar { width: 6px; }
        .side-scroll::-webkit-scrollbar-thumb { background: #e4e4e7; border-radius: 10px; }

        .field {
            width: 100%;
            border: 1px solid #e4e4e7;
            background: #fff;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color .15s;
        }
        .field:focus { border-color: #18181b; }
        .field::placeholder { color: #c4c4cc; }
        .ph { color: #bdbdbd; }
        .a4-wrapper.exporting .ph { visibility: hidden; }
        .label { display: block; font-size: 12px; color: #71717a; margin-bottom: 4px; }

        /* ================= A4 PAGE ================= */
        .a4-wrapper {
            width: 210mm;
            height: 296mm;
            background: #fff;
            box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 30px rgba(0,0,0,.06);
            font-family: 'Times New Roman', Times, serif !important;
            color: #000;
            padding: 30mm 25mm 25mm;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .a4-wrapper.exporting { box-shadow: none; }

        .hdr { width: 100%; display: flex; flex-direction: column; align-items: center; }
        .hdr .logo { height: 140px; width: auto; object-fit: contain; margin-bottom: 12px; }
        .hdr .uni { font-size: 30px; font-weight: bold; color: #000; }

        .doc-type { font-size: 34px; font-weight: bold; letter-spacing: .08em; text-transform: uppercase; margin-top: 14mm; }
        .doc-title { font-size: 26px; margin-top: 8px; line-height: 1.3; max-width: 155mm; }
        .course { font-size: 19px; margin-top: 10mm; line-height: 1.6; }
        .parties { display: flex; flex-direction: column; align-items: center; gap: 9mm; margin-top: 10mm; width: 100%; font-size: 19px; line-height: 1.6; }
        .party { width: 100%; }
        .party-head { font-weight: bold; font-size: 20px; margin-bottom: 4px; }
        .footer { margin-top: auto; width: 100%; display: flex; flex-direction: column; align-items: center; font-size: 19px; }
        .footer .line { width: 100%; max-width: 400px; border-bottom: 1px solid #000; margin-top: 8px; }

        /* ---- Design 2: Framed ---- */
        .a4-wrapper[data-design="framed"]::before {
            content: ''; position: absolute; inset: 9mm; border: 2px solid #000; pointer-events: none;
        }
        .a4-wrapper[data-design="framed"]::after {
            content: ''; position: absolute; inset: 11.5mm; border: .6px solid #000; pointer-events: none;
        }

        /* ---- Design 3: Modern (left aligned) ---- */
        .a4-wrapper[data-design="modern"] { align-items: flex-start; text-align: left; padding-top: 26mm; }
        .a4-wrapper[data-design="modern"] .hdr { flex-direction: row; align-items: center; gap: 16px; padding-bottom: 8mm; border-bottom: 4px solid #000; }
        .a4-wrapper[data-design="modern"] .hdr .logo { height: 86px; margin: 0; }
        .a4-wrapper[data-design="modern"] .hdr .uni { font-size: 28px; line-height: 1.15; }
        .a4-wrapper[data-design="modern"] .doc-type { margin-top: 24mm; font-size: 38px; letter-spacing: .04em; }
        .a4-wrapper[data-design="modern"] .doc-title { margin-top: 10px; }
        .a4-wrapper[data-design="modern"] .parties { flex-direction: row; gap: 14mm; }
        .a4-wrapper[data-design="modern"] .party { flex: 1; border-top: 2px solid #000; padding-top: 6px; }
        .a4-wrapper[data-design="modern"] .footer { align-items: flex-start; }
        .a4-wrapper[data-design="modern"] .footer .line { max-width: 100%; }

        /* ---- Design 4: Band (black header) ---- */
        .a4-wrapper[data-design="band"] { padding-top: 0; }
        .a4-wrapper[data-design="band"] .hdr {
            background: #000; color: #fff; margin: 0 -25mm; width: calc(100% + 50mm);
            padding: 14mm 0 10mm;
        }
        .a4-wrapper[data-design="band"] .hdr .logo {
            height: 120px; width: 120px; background: #fff; border-radius: 50%; padding: 10px; box-sizing: border-box; margin-bottom: 10px;
        }
        .a4-wrapper[data-design="band"] .hdr .uni { color: #fff; font-size: 28px; letter-spacing: .04em; }
        .a4-wrapper[data-design="band"] .doc-type { margin-top: 16mm; }
        .a4-wrapper[data-design="band"] .parties { flex-direction: row; gap: 10mm; }
        .a4-wrapper[data-design="band"] .party { flex: 1; }
        .a4-wrapper[data-design="band"] .party-head { display: inline-block; border-bottom: 2px solid #000; padding: 0 10px 2px; }

        /* ---- Design 5: Boxed ---- */
        .a4-wrapper[data-design="boxed"] .doc-type { margin-top: 12mm; border-top: 3px solid #000; border-bottom: 3px solid #000; padding: 6px 28px; }
        .a4-wrapper[data-design="boxed"] .course { width: 100%; border: 2px solid #000; padding: 4mm; margin-top: 10mm; box-sizing: border-box; }
        .a4-wrapper[data-design="boxed"] .parties { flex-direction: row; align-items: stretch; gap: 8mm; margin-top: 8mm; }
        .a4-wrapper[data-design="boxed"] .party { flex: 1; border: 2px solid #000; box-sizing: border-box; padding: 0 4mm 4mm; }
        .a4-wrapper[data-design="boxed"] .party-head { background: #000; color: #fff; margin: 0 -4mm 4mm; padding: 6px 0; }
        .a4-wrapper[data-design="boxed"] .footer { border: 2px solid #000; padding: 4mm; box-sizing: border-box; }
        .a4-wrapper[data-design="boxed"] .footer .line { display: none; }
    </style>
</head>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="label" for="in-design">Design</label>
                    <select id="in-design" class="field cursor-pointer">
                        <option value="classic" selected>Classic</option>
                        <option value="framed">Framed</option>
                        <option value="modern">Modern</option>
                        <option value="band">Black band</option>
                        <option value="boxed">Boxed</option>

                <div>

                        <option value="'Playfair Display', Georgia, serif" selected>Playfair</option>
                        <option value="'Cinzel', Georgia, serif">Cinzel</option>
                        <option value="'EB Garamond', Garamond, serif">Garamond</option>
                        <option value="'Montserrat', Arial, sans-serif">Montserrat</option>
                        <option value="'Oswald', Arial, sans-serif">Oswald</option>

            </div>

            <div class="h-px bg-zinc-100"></div>

            <div>

                    <option value="Lab Report">Lab Report</option>
                    <option value="Homework">Homework</option>
                </select>
            </div>

            <div>
                <label class="label" for="in-title">Title</label>
                <input type="text" id="in-title" class="field" autocomplete="off">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="label" for="in-courseCode">Course code</label>
                    <input type="text" id="in-courseCode" class="field" autocomplete="off">
                </div>
                <div>
                    <label class="label" for="in-section">Section</label>
                    <input type="text" id="in-section" class="field" autocomplete="off">
                </div>
            </div>

            <div>
                <label class="label" for="in-courseName">Course name</label>
                <input type="text" id="in-courseName" class="field" autocomplete="off">
            </div>

            <div class="h-px bg-zinc-100"></div>

            <div>
                <label class="label" for="in-name">Your name</label>
                <input type="text" id="in-name" class="field" autocomplete="off">
            </div>

            <div>
                <label class="label" for="in-studentId">Student ID</label>
                <input type="text" id="in-studentId" class="field" autocomplete="off">
            </div>

            <div class="h-px bg-zinc-100"></div>

            <div>

            </div>

    <script>
        const fields = ['docType', 'title', 'courseCode', 'courseName', 'section', 'name', 'studentId', 'faculty', 'department', 'date'];
        const allInputs = [...fields, 'design', 'titleFont'];
        const defaults = {};
        allInputs.forEach(f => defaults[f] = document.getElementById(`in-${f}`).value);

        const page = document.getElementById('a4-page');

        // ---------- Random "e.g." examples (change on every load / reset) ----------
        const pick = a => a[Math.floor(Math.random() * a.length)];
        const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
        const ordinal = n => { const s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };

        function randomizeExamples() {
            const course = pick([
                ['MGT310', 'Introduction to Management'],
                ['EEE141', 'Electrical Circuits I'],
                ['CSE225', 'Data Structures and Algorithms'],
                ['ENG103', 'Intermediate Composition'],
                ['MAT250', 'Calculus and Analytical Geometry'],
                ['MKT202', 'Principles of Marketing']
            ]);
            const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            const ex = {
                title: pick(['Local Entrepreneur Case', 'Market Analysis of a Retail Brand', 'Leadership Styles in Practice', 'Circuit Analysis Experiment', 'Business Ethics Case Study', 'Sorting Algorithms Comparison']),
                courseCode: course[0],
                courseName: course[1],
                section: String(rnd(1, 9)),
                name: pick(['Rafiq Ahmed', 'Nusrat Jahan', 'Tanvir Hasan', 'Samia Rahman', 'Arif Chowdhury', 'Mehnaz Karim', 'Sabbir Hossain', 'Tasnim Akter']),
                studentId: pick(['24', '25', '23']) + String(rnd(0, 9999999)).padStart(7, '0'),
                faculty: pick(['Dr. Farhan Islam (FNI)', 'Ms. Laila Sultana (LAS)', 'Mr. Imran Kabir (IMK)', 'Dr. Nabila Haque (NBH)', 'Mr. Shafiq Rahim (SFR)']),
                department: pick(['Electrical & Computer Engineering', 'Management', 'Mathematics & Physics', 'English & Modern Languages', 'Marketing & International Business']),
                date: `${ordinal(rnd(1, 28))} ${pick(months)}, ${rnd(2025, 2026)}`
            };
            Object.keys(ex).forEach(f => {
                const el = document.getElementById(`in-${f}`);
                el.dataset.example = ex[f];
                el.placeholder = 'e.g. ' + ex[f];
            });
        }

        function updatePreview() {
            fields.forEach(f => {
                const inp = document.getElementById(`in-${f}`);
                const out = document.getElementById(`out-${f}`);
                if (!inp || !out) return;
                const v = inp.value.trim();
                const ex = inp.dataset.example || '';
                out.textContent = v || ex || '\u2026';
                out.classList.toggle('ph', !v && !!ex);
            });
            page.dataset.design = document.getElementById('in-design').value;
            document.getElementById('out-title').style.fontFamily = document.getElementById('in-titleFont').value;
        }

        document.querySelectorAll('.field').forEach(el => {
            el.addEventListener('input', updatePreview);
            el.addEventListener('change', updatePreview);
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            allInputs.forEach(f => document.getElementById(`in-${f}`).value = defaults[f]);
            randomizeExamples();
            updatePreview();
        });

        // Fit page to the preview area
        const A4_W = 794, A4_H = 1118;
        function scaleToFit() {
            const c = document.getElementById('preview-container');
            const s = Math.min((c.clientWidth - 60) / A4_W, (c.clientHeight - 60) / A4_H, 1);
            document.getElementById('scale-wrapper').style.transform = `scale(${s})`;
        }
        window.addEventListener('resize', scaleToFit);

        async function downloadPDF() {
            const wrapper = document.getElementById('scale-wrapper');
            const btn = document.getElementById('download-btn');

            const code = document.getElementById('in-courseCode').value.trim() || 'Course';
            const id = document.getElementById('in-studentId').value.trim() || 'ID';
            const filename = `Cover_${code}_${id}.pdf`.replace(/\s+/g, '_');

            const opt = {
                margin: 0,
                filename,
                image: { type: 'jpeg', quality: 1 },
                html2canvas: { scale: 3, useCORS: true, logging: false },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            const prev = wrapper.style.transform;
            wrapper.style.transform = 'scale(1)';
            page.classList.add('exporting');
            btn.disabled = true;
            btn.textContent = 'Generating…';

            const done = () => {
                page.classList.remove('exporting');
                wrapper.style.transform = prev;
                btn.disabled = false;
                btn.textContent = 'Download PDF';
            };
            try {
                if (document.fonts && document.fonts.ready) await document.fonts.ready;
                await html2pdf().set(opt).from(page).save();
            } finally { done(); }
        }

        document.addEventListener('DOMContentLoaded', () => { randomizeExamples(); updatePreview(); scaleToFit(); });
    </script>
</body>
</html>
